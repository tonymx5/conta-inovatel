<!DOCTYPE html><html lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Chronos Precision - Monthly Calendar</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            surface: '#faf8ff',
            'surface-dim': '#d2d9f4',
            'surface-bright': '#faf8ff',
            'surface-container-lowest': '#ffffff',
            'surface-container-low': '#f2f3ff',
            'surface-container': '#eaedff',
            'surface-container-high': '#e2e7ff',
            'surface-container-highest': '#dae2fd',
            primary: '#004ac6',
            'on-primary': '#ffffff',
            'primary-container': '#2563eb',
            'on-primary-container': '#eeefff',
            secondary: '#505f76',
            'on-secondary': '#ffffff',
            'secondary-container': '#d0e1fb',
            'on-secondary-container': '#54647a',
            tertiary: '#515659',
            'on-tertiary': '#ffffff',
            'tertiary-container': '#696e71',
            'on-tertiary-container': '#edf1f5',
            error: '#ba1a1a',
            'on-error': '#ffffff',
            'error-container': '#ffdad6',
            'on-error-container': '#93000a',
            background: '#faf8ff',
            'on-background': '#131b2e',
            outline: '#737686',
            'outline-variant': '#c3c6d7',
          }
        }
      }
    }
  </script>
<style data-purpose="layout">
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    /* Ensure bottom nav doesn't cover content */
    .content-area {
      padding-bottom: calc(4rem + env(safe-area-inset-bottom));
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen font-sans flex flex-col relative overflow-hidden">
<!-- BEGIN: Main Content Area -->
<main class="flex-1 content-area flex flex-col p-4 relative z-10 overflow-y-auto">
<!-- Top Actions: Add Task Button -->
<!-- Calendar Container (Glassmorphism Card) -->
<div class="bg-surface-container-lowest border border-outline-variant/30 rounded-3xl p-6 flex-1 flex flex-col relative mb-4 shadow-sm">
<!-- Month/Year Header with Navigation -->
<div class="flex justify-between items-center mb-6">
<div class="flex items-center gap-3">
<div class="flex items-center gap-1">
<button class="p-1 rounded-full text-secondary hover:bg-surface-container transition-colors">
<svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</button>
<h1 class="text-2xl font-bold tracking-tight text-on-background">Marzo</h1>
<button class="p-1 rounded-full text-secondary hover:bg-surface-container transition-colors">
<svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</button>
</div>
<span class="font-bold text-secondary/60 text-2xl">24.</span>
</div>
<button class="bg-primary text-on-primary px-4 py-2 rounded-xl text-sm font-semibold shadow-sm hover:opacity-90 transition-opacity flex items-center gap-2">
<svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
    Agregar
  </button>
</div>
<!-- Days of Week Header -->
<div class="bg-surface-container-low rounded-xl py-3 px-2 mb-6">
<div class="grid grid-cols-7 gap-1 text-center">
<div class="text-xs font-semibold text-tertiary">Dom</div>
<div class="text-xs font-semibold text-secondary">Lun</div>
<div class="text-xs font-semibold text-primary text-sm">Mar</div>
<div class="text-xs font-semibold text-secondary">Mié</div>
<div class="text-xs font-semibold text-secondary">Jue</div>
<div class="text-xs font-semibold text-secondary">Vie</div>
<div class="text-xs font-semibold text-tertiary">Sáb</div>
</div>
</div>
<!-- Calendar Grid -->
<div class="grid grid-cols-7 gap-y-4 gap-x-1 text-center flex-1">
<!-- Empty cells for start of month -->
<div class="text-sm font-medium text-on-background/20 py-2"></div>
<div class="text-sm font-medium text-on-background/20 py-2"></div>
<div class="text-sm font-medium text-on-background/20 py-2"></div>
<div class="text-sm font-medium text-on-background/20 py-2"></div>
<div class="text-sm font-medium text-on-background/20 py-2"></div>
<!-- Days -->
<div class="text-sm font-medium text-on-background/80 py-2">1</div>
<div class="text-sm font-medium text-on-background/80 py-2">2</div>
<div class="text-sm font-medium text-on-background/80 py-2">3</div>
<div class="text-sm font-medium text-on-background/80 py-2">4</div>
<div class="text-sm font-medium text-on-background/80 py-2">5</div>
<div class="text-sm font-medium text-on-background/80 py-2">6</div>
<div class="text-sm font-medium text-on-background/80 py-2">7</div>
<div class="text-sm font-medium text-on-background/80 py-2">8</div>
<div class="text-sm font-medium text-on-background/80 py-2">9</div>
<div class="text-sm font-medium text-on-background/80 py-2">10</div>
<div class="text-sm font-medium text-on-background/80 py-2">11</div>
<!-- Highlighted Day 12 -->
<div class="flex justify-center items-center">
<div class="bg-primary/10 text-primary w-8 h-8 rounded-xl flex items-center justify-center text-sm font-bold relative">12<div class="absolute -bottom-1 w-4 h-1 bg-primary rounded-full"></div></div>
</div>
<div class="text-sm font-medium text-on-background/80 py-2">13</div>
<div class="text-sm font-medium text-on-background/80 py-2">14</div>
<div class="text-sm font-medium text-on-background/80 py-2">15</div>
<div class="text-sm font-medium text-on-background/80 py-2">16</div>
<div class="text-sm font-medium text-on-background/80 py-2">17</div>
<div class="text-sm font-medium text-on-background/80 py-2">18</div>
<div class="text-sm font-medium text-on-background/80 py-2">19</div>
<div class="text-sm font-medium text-on-background/80 py-2">20</div>
<div class="text-sm font-medium text-on-background/80 py-2">21</div>
<div class="text-sm font-medium text-on-background/80 py-2">22</div>
<div class="text-sm font-medium text-on-background/80 py-2">23</div>
<div class="text-sm font-medium text-on-background/80 py-2">24</div>
<div class="text-sm font-medium text-on-background/80 py-2">25</div>
<div class="text-sm font-medium text-on-background/80 py-2">26</div>
<div class="text-sm font-medium text-on-background/80 py-2">27</div>
<div class="text-sm font-medium text-on-background/80 py-2">28</div>
<!-- Highlighted Day 29 -->
<div class="flex justify-center items-center">
<div class="bg-primary/10 text-primary w-8 h-8 rounded-xl flex items-center justify-center text-sm font-bold relative">29<div class="absolute -bottom-1 w-4 h-1 bg-primary rounded-full"></div></div>
</div>
<div class="text-sm font-medium text-on-background/80 py-2">30</div>
<div class="text-sm font-medium text-on-background/80 py-2">31</div>
</div>
</div>
<!-- END Calendar Container -->
<!-- Events Below Calendar -->
<div class="grid grid-cols-2 gap-4">
<!-- Events List -->
<div class="flex flex-col gap-3">
<!-- Event 1 -->
<div class="bg-surface-container-lowest border border-outline-variant/30 rounded-2xl flex items-stretch overflow-hidden shadow-sm">
<div class="w-12 bg-surface-container-low flex items-center justify-center border-r border-outline-variant/30 font-bold text-secondary">
            12
          </div>
<div class="p-3 text-sm font-medium text-on-background flex-1">
            Inicio del Curso
          </div>
</div>
<!-- Event 2 -->
<div class="bg-surface-container-lowest border border-outline-variant/30 rounded-2xl flex items-stretch overflow-hidden shadow-sm">
<div class="w-12 bg-surface-container-low flex items-center justify-center border-r border-outline-variant/30 font-bold text-secondary">
            29
          </div>
<div class="p-3 text-sm font-medium text-on-background flex-1">
            Viaje en Coche
          </div>
</div>
</div>
<!-- Quote/Note Block -->
<div class="bg-surface-container-lowest border border-outline-variant/30 rounded-2xl p-4 flex items-center justify-center text-sm text-center font-medium text-on-background/80 leading-relaxed shadow-sm">
        En el aquí y ahora, tocamos la belleza atemporal de la vida
      </div>
</div>
</main>
<!-- END: Main Content Area -->
<!-- BEGIN: Bottom Navigation -->
<nav class="fixed bottom-0 w-full bg-surface-container-lowest border-t border-outline-variant/30 rounded-t-3xl pb-safe z-50">
<div class="flex justify-around items-center h-16 px-4 px-6">
<!-- Month Tab (Active) -->
<a class="flex flex-col items-center justify-center w-full h-full text-primary" href="#">
<svg class="h-6 w-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="text-[10px] font-semibold font-bold">Mes</span>
</a>
<!-- Week Tab -->
<a class="flex flex-col items-center justify-center w-full h-full text-secondary hover:text-on-background transition-colors" href="#">
<svg class="h-6 w-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="text-[10px] font-medium">Semana</span>
</a>
<!-- Day Tab -->
<a class="flex flex-col items-center justify-center w-full h-full text-secondary hover:text-on-background transition-colors" href="#">
<svg class="h-6 w-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="text-[10px] font-medium">Día</span>
</a>
<!-- Agenda Tab -->
<a class="flex flex-col items-center justify-center w-full h-full text-secondary hover:text-on-background transition-colors" href="#">
<svg class="h-6 w-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M4 6h16M4 10h16M4 14h16M4 18h16" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="text-[10px] font-medium">Agenda</span>
</a>
</div>
</nav>
<!-- END: Bottom Navigation -->


</body></html>
